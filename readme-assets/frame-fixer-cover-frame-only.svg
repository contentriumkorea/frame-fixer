<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Frame Fixer</title>
  <desc id="desc">Keep every frame. Fix the cadence. Grayscale frame strips illustrate irregular timing becoming evenly spaced.</desc>
  <rect width="1200" height="520" rx="28" fill="#171717"/>
  <g fill="none" stroke="#2c2c2c"><path d="M640 0v520M0 448h1200"/><circle cx="964" cy="240" r="176"/><circle cx="964" cy="240" r="128"/></g>
  <g fill="#e8e7e3" font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="66" font-size="15" letter-spacing="4">CONTENTRIUM / VIDEO TOOLS</text>
    <text x="60" y="184" font-size="78" font-weight="650" letter-spacing="-3">Frame</text>
    <text x="60" y="268" font-size="78" font-weight="650" letter-spacing="-3">Fixer.</text>
    <text x="64" y="330" font-size="24">Keep every frame.</text>
    <text x="64" y="365" font-size="24" fill="#a3a3a0">Fix the cadence.</text>
    <text x="64" y="488" font-size="15" letter-spacing="2" fill="#b1b1ad">FRAME CORRECTION / SOURCE PRESERVED</text>
    <text x="1136" y="488" text-anchor="end" font-size="14" fill="#92928f">WINDOWS / X64</text>
  </g>
  <g transform="translate(700 90)" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">
    <text x="0" y="0" fill="#858582">SOURCE TIMING</text>
    <path d="M0 78h430" stroke="#555552"/>
    <g fill="#292929" stroke="#72726e">
      <rect x="0" y="25" width="52" height="106" rx="10"/><rect x="70" y="34" width="52" height="106" rx="10"/>
      <rect x="165" y="21" width="52" height="106" rx="10"/><rect x="227" y="40" width="52" height="106" rx="10"/><rect x="335" y="28" width="52" height="106" rx="10"/>
    </g>
    <g fill="#b9b9b3" font-size="20" letter-spacing="0" text-anchor="middle"><text x="26" y="85">01</text><text x="96" y="94">02</text><text x="191" y="81">03</text><text x="253" y="100">04</text><text x="361" y="88">05</text></g>
    <path d="M208 172v30m-7-7 7 7 7-7" fill="none" stroke="#aaa9a3" stroke-width="2"/>
    <text x="0" y="238" fill="#bdbdb7">FIXED CADENCE / SAME FRAMES</text>
    <g fill="#d9d8d2"><rect x="0" y="260" width="64" height="70" rx="10"/><rect x="84" y="260" width="64" height="70" rx="10"/><rect x="168" y="260" width="64" height="70" rx="10"/><rect x="252" y="260" width="64" height="70" rx="10"/><rect x="336" y="260" width="64" height="70" rx="10"/></g>
    <g fill="#242424" font-size="20" letter-spacing="0" text-anchor="middle"><text x="32" y="303">01</text><text x="116" y="303">02</text><text x="200" y="303">03</text><text x="284" y="303">04</text><text x="368" y="303">05</text></g>
  </g>
</svg>
